# Despliegue de bio-orbit (Dokploy: servicio Compose apuntando a este archivo).
# Las variables salen del entorno (Dokploy) o de un .env en la raíz (ver .env.example).
# Única entrada: `bio-orbit-proxy` (nginx Alpine, puerto 8080) → /api → bio-orbit-api-agent, / → bio-orbit-frontend.
# Sin `ports`: Dokploy/Traefik enruta el dominio al servicio `bio-orbit-proxy`. En local, compose.override.yml lo publica.
services:
  bio-orbit-proxy:
    container_name: bio-orbit-proxy
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      - bio-orbit-api-agent
      - bio-orbit-frontend
    expose:
      - "8080"

  bio-orbit-api-agent:
    container_name: bio-orbit-api-agent
    build:
      context: ./api-agent
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5.4-mini}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-low}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      DB_PATH: data/knowledge.db
    volumes:
      - api-data:/app/data
    expose:
      - "8000"

  # Genera data/knowledge.db una vez (y al cambiar la base de conocimiento):
  #   docker compose --profile ingest run --rm bio-orbit-ingest
  bio-orbit-ingest:
    container_name: bio-orbit-ingest
    profiles: ["ingest"]
    build:
      context: ./api-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      DB_PATH: data/knowledge.db
    volumes:
      - api-data:/app/data
    command: ["python", "-m", "ingestion.build_db"]

  bio-orbit-frontend:
    container_name: bio-orbit-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  api-data:
