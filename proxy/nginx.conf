# Única entrada de bio-orbit: /api → api-agent, / → frontend.
# Los nombres se resuelven con el DNS de Docker en cada petición (resolver + variables):
# el proxy arranca aunque un servicio aún no exista y sigue la IP nueva tras un redeploy.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;

  # Salud del propio proxy (no depende de los otros servicios)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Backend: /api/v1/... → api-agent:8000/v1/... (se quita el prefijo).
  # Ninguna clave de OpenAI llega al navegador; todo es mismo origen, sin CORS.
  location = /api {
    return 301 /api/;
  }
  location /api/ {
    set $api http://api-agent:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    # /v1/recommendations llama al modelo (~20 s); el frontend corta a los 60 s.
    proxy_read_timeout 90s;
  }

  # Frontend (SPA servida por su propio nginx)
  location / {
    set $frontend http://frontend:8080;
    proxy_pass $frontend;
  }
}
